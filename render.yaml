# Render Blueprint for the backend (issue #5). Render reads this file from main:
# Dashboard -> New -> Blueprint -> pick this repo. Pushes to main redeploy automatically.
services:
  - type: web
    name: counting-the-cold-api
    runtime: python
    plan: free
    region: oregon            # closest free region to California
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7         # CI tests on 3.12; the pinned requirements have wheels for it
      - key: CIMIS_KEY
        sync: false           # Render asks for the value once; it never lives in the repo
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173   # add the Vercel URL here after #24 (comma-separated)
      - key: DEMO_MODE
        value: "0"
